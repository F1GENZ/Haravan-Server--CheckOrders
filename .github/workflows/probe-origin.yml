name: Probe origin exposure

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Postgres port 5432
        env:
          VPS_TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -uo pipefail
          ssh -o StrictHostKeyChecking=no "$VPS_TARGET" "ss -ltn | awk 'NR==1 || /:5432 /'; echo '--- process'; sudo -n ss -ltnp 2>/dev/null | grep ':5432 ' | grep -o 'users:((\"[a-z0-9_-]*' || echo 'process: not readable'; echo '--- services'; systemctl list-units --type=service --state=running 2>/dev/null | grep -iE 'postgres|supabase|pgbouncer' || echo 'no postgres service'; (command -v docker >/dev/null && docker ps --format '{{.Names}} {{.Image}} {{.Ports}}' 2>/dev/null | grep -E '5432' ) || echo 'no docker container on 5432'"
          ssh -o StrictHostKeyChecking=no "$VPS_TARGET" "sudo -n -u postgres psql -Atc \"select 'ssl=' || current_setting('ssl') || ' password_encryption=' || current_setting('password_encryption') || ' listen=' || current_setting('listen_addresses')\" 2>/dev/null || echo 'psql: not readable'; sudo -n -u postgres psql -Atc \"select 'db ' || datname || ' size=' || pg_size_pretty(pg_database_size(datname)) from pg_database where not datistemplate\" 2>/dev/null; sudo -n -u postgres psql -Atc \"select 'hba ' || type || ' ' || array_to_string(database, ',') || ' ' || array_to_string(user_name, ',') || ' ' || coalesce(address, '-') || ' ' || coalesce(netmask, '') || ' ' || auth_method from pg_hba_file_rules where error is null\" 2>/dev/null; sudo -n -u postgres psql -Atc \"select 'role ' || rolname || case when rolsuper then ' SUPER' else '' end || case when rolpassword is null then ' nopass' else '' end from pg_authid where rolcanlogin\" 2>/dev/null"
          if timeout 6 bash -c "</dev/tcp/$VPS_HOST/5432" 2>/dev/null; then echo "public tcp 5432: OPEN"; else echo "public tcp 5432: closed or filtered"; fi
